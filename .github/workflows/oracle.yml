name: oracle
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The workflow's default token is READ-ONLY in this repo
    # (actions/permissions/workflow: default_workflow_permissions=read), so
    # without this the ledger commit below is a push of nothing.
    permissions:
      contents: write
    # The job now pushes. Two overlapping runs racing to push the ledger is a
    # rejected push, not a memory.
    concurrency:
      group: oracle-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '9.0.x' }
      - name: clone the ports and suites as siblings
        run: |
          # The token is EMBEDDED. Without it git falls back to an
          # interactive credential prompt, and a CI runner has no terminal:
          #
          #   fatal: could not read Username for 'https://github.com':
          #          No such device or address
          #
          # which is an unhelpful way to say "authentication failed".
          #
          # And the python port's repository is `git.pp-doctor` --
          # `gitpp-doctor` is a DIRECTORY NAME, not a repository. Cloning
          # it 404s, and the 404 is what makes git ask for credentials in
          # the first place. Both bugs had to be fixed for this step to
          # work at all.
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/git.pp-doctor        ../gitpp-doctor
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-js            ../gitpp-js
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-cs           ../gitpp-cs
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-pl           ../gitpp-pl
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-c            ../gitpp-c
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-cross-port   ../gitpp-cross-port
          git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/SuperInstance/gitpp-fold-conformance ../gitpp-fold-conformance
      - name: build the C leaf wrapper
        # CLleaf.c lives in gitpp-cross-port, NOT in gitpp-c. The step
        # compiled it in ../gitpp-c and died with
        #
        #   cc1: fatal error: CLleaf.c: No such file or directory
        #
        # The oracle's LEAF suite is gitpp-cross-port/fuzz.mjs, and the
        # C binary it drives is gitpp-cross-port/CLleaf.
        working-directory: ../gitpp-cross-port
        run: gcc -O2 -o CLleaf CLleaf.c -lm
      - name: build the C port from source
        # The repo ships a COMMITTED binary. A stale committed binary
        # would be the wrong build, and the participant's version is
        # recorded from this checkout.
        working-directory: ../gitpp-c
        run: |
          make clean
          make
          test -x ./gitpp
      - name: build the C# wrapper
        working-directory: ../gitpp-cross-port
        # The project reference is passed EXPLICITLY. The csproj's own
        # default is now relative, but a build that depends on the
        # caller's layout should say so:
        #
        #   dotnet build CsLeaf -p:GitppCsProj=$GITHUB_WORKSPACE/gitpp-cs/src/Gitpp.csproj
        run: |
          # The ABSOLUTE path of the port, computed from where it was
          # actually cloned.
          #
          # It used to be $GITHUB_WORKSPACE/gitpp-cs/src/Gitpp.csproj,
          # which is one level too deep: the clone step runs
          # `git clone ... ../gitpp-cs` with the working directory at
          # $GITHUB_WORKSPACE, so the port lands at
          # $GITHUB_WORKSPACE/../gitpp-cs -- ONE LEVEL UP.
          #
          # The same off-by-one-level mistake as the negctl workflow's
          # GITPP_C_BIN. The fix is the same too: derive the path from
          # the clone, never from an assumption about the layout.
          GITPP_CS_DIR="$(cd ../gitpp-cs && pwd)"
          dotnet build CsLeaf -p:GitppCsProj="$GITPP_CS_DIR/src/Gitpp.csproj"
          test -f ../gitpp-cross-port/CsLeaf/bin/Debug/net9.0/CsLeaf.dll
      - name: build the FOLD suite's C# wrapper
        # The FOLD suite (gitpp-fold-conformance) has its OWN C# wrapper,
        # wrappers/CsDerive, and it is a DIFFERENT project from the leaf
        # suite's CsLeaf. The oracle built only the leaf one, so the fold
        # suite's C# participant could not load and it reported
        #
        #   fold: divergence (0/29)
        #
        # -- every case failing on a participant that was never built,
        # reported as a DIVERGENCE rather than as a missing participant.
        working-directory: ../gitpp-fold-conformance
        run: |
          dotnet build wrappers/CsDerive
          test -f wrappers/CsDerive/bin/Debug/net9.0/CsDerive.dll
      - name: every participant must be present
        # A participant that cannot run must be a FAILURE, not a silently
        # smaller set: a run over four ports reports the same pass count
        # as a run over five.
        run: |
          test -f ../gitpp-doctor/gitpp_doctor.py
          test -f ../gitpp-js/src/gitpp.js
          test -f ../gitpp-pl/lib/Gitpp.pm
          test -f ../gitpp-c/gitpp
          test -x ../gitpp-cross-port/CLleaf
          test -d ../gitpp-fold-conformance
          test -f ../gitpp-fold-conformance/wrappers/CsDerive/bin/Debug/net9.0/CsDerive.dll
          echo "  all participants present"
      - name: generate the corpus
        # generate.py is PYTHON. It was invoked with node, which failed,
        # and the `||` fallback then wrote an EMPTY corpus:
        #
        #   node -e "require('fs').writeFileSync('/tmp/corpus.json','[]')"
        #
        # So the oracle compared NOTHING and reported success. The
        # fallback existed to keep the job green, and that is exactly
        # what it did -- it turned a broken setup into a green badge
        # over an empty corpus.
        #
        # There is no fallback now. If the corpus cannot be generated,
        # the job fails.
        run: |
          python3 ../gitpp-cross-port/generate.py /tmp/corpus.json
                    python3 -c "
          import json, sys
          recs = json.load(open('/tmp/corpus.json'))
          print('  %d record(s) in the corpus' % len(recs))
          if len(recs) < 1000:
              print('FAIL: the corpus has only %d record(s)' % len(recs))
              sys.exit(1)
          "
      - name: ledger baseline
        # What the ledger held BEFORE this run. The assertion below compares
        # against this and not against zero: once the ledger is committed,
        # "the file is non-empty" is true forever, and a run that recorded
        # nothing would pass it on yesterday's rows.
        #
        # Counted exactly the way `summarise` counts rows, or the two numbers
        # could disagree at the boundary.
        run: |
          BEFORE="$(node -e 'let n=0;try{const t=require("fs").readFileSync("ledger.jsonl","utf8");n=t.trim().split("\n").filter(Boolean).length}catch{};process.stdout.write(String(n))')"
          echo "  ledger holds $BEFORE row(s) before this run"
          echo "LEDGER_BEFORE=$BEFORE" >> "$GITHUB_ENV"
      - name: one pass
        # The participants' OWN environment. Every port is resolved at
        # run time by the suite it belongs to, and the suites default
        # to the layout of one machine. These are derived from the
        # clones, not from an assumption about the layout.
        #
        # Without them the python participant raised
        #     ModuleNotFoundError: No module named 'gitpp_doctor'
        # and the fold suite reported 0/29, because the C port had no
        # binary to run and the perl port had no module path.
        #
        # A run over zero participants reports the same pass count as a
        # run over five.
        env:
          GITPP_DOCTOR_DIR: ${{ github.workspace }}/../gitpp-doctor
          GITPP_JS_SRC: ${{ github.workspace }}/../gitpp-js/src/gitpp.js
          GITPP_PL_DIR: ${{ github.workspace }}/../gitpp-pl
          GITPP_C_BIN: ${{ github.workspace }}/../gitpp-c/gitpp
          GITPP_JS: ${{ github.workspace }}/../gitpp-js/src/gitpp.js
          ORACLE_CORPUS: /tmp/corpus.json
        run: node oracle.mjs run
      - name: ledger summary
        if: always()
        run: node oracle.mjs ledger
      - name: the ledger must hold THIS run
        # The half that matters. `ledger` above prints {"runs": 0} and exits 0,
        # and the job went GREEN like that for every scheduled run since the
        # oracle was written -- a scorer holding no memory of a single previous
        # run. This step is what a green badge now has to answer to.
        #
        # `always()`, deliberately: if `one pass` died before appending -- an
        # unparseable known-limitations.json, a full disk, a kill -- the job
        # goes RED here instead of reporting a run that recorded nothing.
        if: always()
        run: node oracle.mjs assert "$LEDGER_BEFORE"
      - name: record the ledger
        # The witness log, committed. Two destinations, because one is not
        # enough:
        #
        #   ledger branch -- EVERY run, one commit, force-pushed. Full
        #     six-hourly resolution at constant history cost. 1,460 runs a
        #     year do not have to become 1,460 commits.
        #   main -- ONCE A DAY, on the first run of a new UTC day, sweeping
        #     every row accumulated since the last one. main is where a reader
        #     lands, and it has to stay readable: a witness log that buries the
        #     commits carrying the thought is not a memory.
        #
        # Authored by an explicit bot identity, never the runner's token
        # identity, so the log is greppable with
        # `git log --author=gitpp-oracle`. Dated by the LAST ROW's own
        # timestamp rather than by the push, so the history is stable and a
        # re-run of the sweep reproduces it.
        if: always()
        env:
          ORACLE_AUTHOR_NAME: gitpp-oracle[bot]
          ORACLE_AUTHOR_EMAIL: gitpp-oracle@superinstance.dev
        run: |
          set -euo pipefail
          test -s ledger.jsonl || { echo "  no ledger to record"; exit 0; }

          # <timestamp> <rows> <green|RED>, counted the way summarise counts.
          read -r STAMP ROWS STATE <<< "$(node -e 'const l=require("fs").readFileSync("ledger.jsonl","utf8").trim().split("\n").filter(Boolean);const last=JSON.parse(l[l.length-1]);process.stdout.write(last.at+" "+l.length+" "+((last.newDivergences||[]).length?"RED":"green"))')"
          echo "  newest row $STAMP, $ROWS row(s) total, $STATE"

          # main's OWN newest committed row, which is what decides whether today's
          # sweep has happened yet. Comparing the newest row in the FILE against
          # today never fires -- the newest row is always from today. This is the
          # question "has main's copy fallen a day behind?", and it is stateless:
          # main's ledger IS the state.
          HEAD_LAST="$(git show HEAD:ledger.jsonl 2>/dev/null)" || HEAD_LAST=""
          HEAD_DAY="$(printf '%s' "$HEAD_LAST" | tail -n 1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s.trim()).at.slice(0,10))}catch{}})')"
          TODAY="$(date -u +%F)"

          git config user.name "$ORACLE_AUTHOR_NAME"
          git config user.email "$ORACLE_AUTHOR_EMAIL"
          git add ledger.jsonl

          # 1. the witness branch: one commit, no history growth.
          BLOB="$(git hash-object -w ledger.jsonl)"
          TREE="$(printf '100644 blob %s\tledger.jsonl\n' "$BLOB" | git mktree)"
          WITNESS="$(GIT_AUTHOR_DATE="$STAMP" GIT_COMMITTER_DATE="$STAMP" \
            git commit-tree "$TREE" -m "ledger: $ROWS run(s) to $STAMP, $STATE")"
          git push --force --quiet origin "$WITNESS:refs/heads/ledger"
          echo "  ledger branch: $WITNESS"

          # 2. main: one rollup a day, so it stays readable.
          if [ -n "$HEAD_DAY" ] && [ "$HEAD_DAY" = "$TODAY" ]; then
            echo "  main: swept today already ($HEAD_DAY) -- every run since is on the ledger branch"
          elif git diff --cached --quiet; then
            echo "  main: ledger unchanged, nothing to commit"
          else
            GIT_COMMITTER_DATE="$STAMP" git commit -q \
              --author="$ORACLE_AUTHOR_NAME <$ORACLE_AUTHOR_EMAIL>" --date="$STAMP" \
              -m "ledger: $ROWS run(s) to $STAMP, $STATE" \
              -m "Append-only witness log, swept once a day. The full per-run copy is on the ledger branch, where every six-hourly run lands as a single force-pushed commit."
            git push --quiet origin HEAD:main \
              || { git pull --rebase --quiet origin main && git push --quiet origin HEAD:main; }
            echo "  main: $(git rev-parse --short HEAD)"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-ledger
          path: ledger.jsonl
